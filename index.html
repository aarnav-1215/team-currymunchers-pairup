<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ee;--card:#fffaf5;--ink:#243656;--mut:#6b6a6f;--line:#e0d5c8;--acc:#cc6a33;--hi:#f3d3b0;--onacc:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2740;--card:#243656;--ink:#f7f3ee;--mut:#c4bfb8;--line:#3a4c70;--acc:#e58a50;--onacc:#1b2740}}
:root[data-theme="dark"]{--bg:#1b2740;--card:#243656;--ink:#f7f3ee;--mut:#c4bfb8;--line:#3a4c70;--acc:#e58a50;--onacc:#1b2740}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Jost",system-ui,sans-serif}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:400;color:var(--acc);line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2.2rem,7vw,3.8rem)}h2{font-size:1.8rem}h3{font-size:1.2rem}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
nav b{font-family:"Playfair Display",Georgia,serif;font-size:1.5rem;font-weight:500;color:var(--acc)}
nav a,.link{letter-spacing:.12em;font-size:.85rem;text-transform:uppercase;text-decoration:none!important;color:var(--ink);cursor:pointer;margin-left:14px;text-decoration:underline;background:none;border:0;font:inherit}
main{max-width:980px;margin:0 auto;padding:24px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:520px;margin:0 auto}
.wide{max-width:none}
label{display:block;font-weight:500;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px}
button.btn{background:var(--acc) linear-gradient(90deg,var(--acc),#e58a50,var(--acc));background-size:200% 100%;transition:background-position .5s;color:var(--onacc);border:0;border-radius:99px;padding:12px 26px;font:inherit;font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;cursor:pointer;margin-top:18px}
button.btn.alt{background:transparent;background-image:none;color:var(--acc);border:1px solid var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.big{display:block;text-align:left;padding:34px 24px;border-radius:16px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.big:hover{color:var(--ink)}.big h2{margin:0 0 6px}
:root{--glow:rgba(204,106,51,.2)}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:rgba(229,138,80,.28)}}
.card,.spot{position:relative}
.card:hover,.spot:hover{background-image:radial-gradient(340px circle at var(--x,50%) var(--y,50%),var(--glow),transparent 65%)}
.spot{transition:border-color .2s,transform .2s,box-shadow .2s}.spot:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 10px 30px -12px var(--acc)}
.hero2{position:relative;overflow:hidden;border-radius:22px;padding:44px 28px;background:#ede4dd;display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:center}
@media(prefers-color-scheme:dark){.hero2{background:#243656}}
.hero2 .glow{position:absolute;left:30%;top:30%;width:560px;height:560px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(204,106,51,.38),rgba(229,138,80,.12) 45%,transparent 70%)}
.hero2 .in,.hero2 svg{position:relative;z-index:1}.hero2 svg{width:100%;max-width:330px;justify-self:center}
.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--acc);margin:0 0 10px}
.grad{background:linear-gradient(90deg,#cc6a33,#e58a50 45%,#243656);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(prefers-color-scheme:dark){.grad{background:linear-gradient(90deg,#e58a50,#f3d3b0,#fff);-webkit-background-clip:text;background-clip:text}}
.lead{max-width:54ch;color:var(--mut);font-size:1.1rem}
.sec{margin-top:44px}.sec>h2{margin-bottom:6px}.sec>p{color:var(--mut);margin:0 0 16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}.step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--onacc);font-weight:500;margin-bottom:10px}
.step h3{margin-top:0}.step p{color:var(--mut);margin:0}
.topics{display:flex;flex-wrap:wrap;gap:10px}.topic{padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:default;transition:background .2s,color .2s,transform .2s,border-color .2s}
.topic:hover{background:var(--acc);color:var(--onacc);border-color:var(--acc);transform:translateY(-2px) rotate(-1.5deg)}
.cta{margin-top:44px;text-align:center;padding:38px 20px}.cta h2{margin-bottom:12px}
footer{max-width:980px;margin:0 auto;padding:26px 18px 50px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
footer a{margin-left:16px}footer .fl a:first-child{margin-left:0}
nav .tw{margin-left:10px;font-size:.75rem;opacity:.85}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#e58a50)}
button.btn:hover{background-position:100% 0}button.btn:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:640px){.hero2,.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips label{display:inline-flex;gap:6px;align-items:center;margin:0;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:400;cursor:pointer}
.chips input{width:auto}
.err{color:#c0392b;min-height:1.2em;margin:10px 0 0}
.prog{display:flex;gap:6px;margin-bottom:14px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--acc)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plan{border:2px solid var(--line);border-radius:14px;padding:20px;background:var(--card)}.plan.pro{border-color:var(--acc)}
.price{font-family:"Playfair Display",Georgia,serif;font-size:2rem;color:var(--acc)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px}.stat b{font-size:1.5rem;display:block}
.tag{display:inline-block;background:var(--hi);color:#14213d;border-radius:6px;padding:1px 8px;font-size:.85rem}
.hub{border-top:6px solid var(--hi)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;background:#ede4dd;border-radius:18px;padding:28px}.hero svg{width:100%;max-width:340px;justify-self:center}@media(prefers-color-scheme:dark){.hero{background:#243656}}
@media(max-width:640px){.split,.plans,.hero{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<nav><span><b id="brand">PairUp</b> <a href="https://techwomenaz.org" target="_blank" rel="noopener" class="tw">&larr; TechWomenAZ</a></span><span id="navr"></span></nav>
<main id="app"></main>
<footer><div><b>PairUp</b> · mentorship for the TechWomenAZ community</div><div class="fl"><a href="https://techwomenaz.org" target="_blank" rel="noopener">TechWomenAZ</a><a href="https://forms.gle/qVG6HHXMBRN1axN96" target="_blank" rel="noopener">Become a member</a><a href="https://givebutter.com/VStKv8" target="_blank" rel="noopener">Donate</a><a href="https://www.instagram.com/techwomenaz" target="_blank" rel="noopener">Instagram</a><a href="https://www.linkedin.com/company/106737268/" target="_blank" rel="noopener">LinkedIn</a></div></footer>
<script>
var LANGS=["Python","JavaScript","Java","C++","C#","Go","Rust","SQL"],LEVELS=["Beginner","Intermediate","Advanced"];
var mem={};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]!==undefined?mem[k]:d}}
function sv(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function go(h){location.hash=h}
function prog(n,t){var s='<div class="prog">';for(var i=1;i<=t;i++)s+='<i class="'+(i<=n?'on':'')+'"></i>';return s+'</div>'}
function chips(name,list,sel){return '<div class="chips">'+list.map(function(l){return '<label><input type="checkbox" name="'+name+'" value="'+l+'"'+((sel||[]).indexOf(l)>-1?' checked':'')+'>'+l+'</label>'}).join("")+'</div>'}
function vals(name){return Array.prototype.map.call(document.querySelectorAll('input[name="'+name+'"]:checked'),function(e){return e.value})}
function v(id){return document.getElementById(id).value.trim()}
function err(m){document.getElementById("err").textContent=m;return false}

function home(){app.innerHTML='<div class="hero2"><div class="glow"></div><div class="in"><p class="eyebrow">Mentorship for everyone, kindergarten and up</p><h1>Guided <span class="grad">Software Development</span> Training</h1><p class="lead">Meet mentors who share your interests, from AI and public speaking to networking and career paths. Every mentor is reviewed by our team before they can meet a student.</p>'+
'<div class="split"><button class="big spot" onclick="start(\'mentor\')"><h2>I am a mentor</h2>Share your experience and guide students.</button><button class="big spot" onclick="start(\'student\')"><h2>I am a student</h2>Find a reviewed mentor who shares your interests.</button></div><p>Already a member? <a class="link" href="#login" style="margin:0">Log in</a></p></div>'+'<svg viewBox="0 0 300 260" role="img" aria-label="A mentor seen from behind coding while a student watches over the laptop"><path d="M20 258V125a130 130 0 0 1 260 0v133z" fill="#f6e3cf" stroke="#e8a070"/><circle cx="200" cy="90" r="38" fill="#fbefe0"/><text x="46" y="92" font-family="ui-monospace,Menlo,monospace" font-size="20" font-weight="700" fill="#cc6a33">&lt;/&gt;</text><path d="M138 156q2-26 42-26t42 26z" fill="#4a6490"/><rect x="172" y="118" width="16" height="16" fill="#e9b88f"/><circle cx="180" cy="100" r="22" fill="#e9b88f"/><path d="M158 98a22 22 0 0 1 44 0q-12-12-22-10t-22 10z" fill="#3b2a20"/><circle cx="205" cy="106" r="6" fill="#3b2a20"/><circle cx="173" cy="103" r="2" fill="#243656"/><circle cx="187" cy="103" r="2" fill="#243656"/><path d="M174 111q6 5 12 0" stroke="#243656" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="120" y="152" width="120" height="70" rx="7" fill="#243656"/><circle cx="180" cy="187" r="8" fill="#cc6a33"/><path d="M106 224h148l8 9H98z" fill="#1b2740"/><rect x="10" y="233" width="280" height="10" fill="#cc6a33"/><rect x="10" y="243" width="280" height="15" fill="#d9773a"/><path d="M26 262q0-48 64-48t64 48z" fill="#cc6a33"/><path d="M62 220q28 14 56 0" stroke="#b5561f" stroke-width="3" fill="none"/><rect x="82" y="196" width="16" height="22" fill="#e0a77c"/><circle cx="90" cy="178" r="27" fill="#2b1d16"/><path d="M128 232q22-8 46-4" stroke="#cc6a33" stroke-width="15" stroke-linecap="round" fill="none"/><circle cx="178" cy="228" r="6" fill="#e0a77c"/></svg>'+'</div>'+
'<div class="sec"><h2>How it works</h2><p>Three simple steps.</p><div class="g3"><div class="step spot"><span class="n">1</span><h3>Tell us what you want to learn</h3><p>Pick a language, your level and what you care about, like AI or public speaking.</p></div><div class="step spot"><span class="n">2</span><h3>Get matched with a reviewed mentor</h3><p>See your match score and choose from several mentors, with badges that show what was checked.</p></div><div class="step spot"><span class="n">3</span><h3>Meet, chat and grow</h3><p>Chat in a filtered workspace and meet at least twice a month. Everyone commits to showing up.</p></div></div></div>'+
'<div class="sec"><h2>Safety comes first</h2><p>Built for students of every age.</p><div class="g3"><div class="step spot"><h3>Mentors are reviewed</h3><p>Our team records an ID check, a profile check and a background check before any mentor is approved.</p></div><div class="step spot"><h3>Online only under 18</h3><p>Students under 18 can only meet online. Everyone else meets in public places.</p></div><div class="step spot"><h3>Filtered chat</h3><p>Bad language is hidden, and phone numbers, emails and links are blocked.</p></div><div class="step spot"><h3>A guardian on file</h3><p>Students under 18 give a parent or guardian email, and anyone can report a problem in one click.</p></div></div></div>'+
'<div class="sec"><h2>Learn what matters</h2><div class="topics">'+["AI","Public speaking","Networking","Career path","Python","JavaScript","Java","Data science","Game dev","Mobile apps"].map(function(t){return '<span class="topic">'+t+'</span>'}).join("")+'</div></div>'+
'<div class="card cta wide spot"><h2>Ready to start?</h2><button class="btn" onclick="start(\'student\')">Join as a student</button> <button class="btn alt" onclick="start(\'mentor\')">Become a mentor</button><p style="margin:18px 0 0;color:var(--mut)">Part of the TechWomenAZ community? <a href="https://forms.gle/qVG6HHXMBRN1axN96" target="_blank" rel="noopener">Become a member</a> or <a href="https://givebutter.com/VStKv8" target="_blank" rel="noopener">support our mission</a>.</p></div>';heroFx()}
function heroFx(){var h=document.querySelector(".hero2"),g=h&&h.querySelector(".glow");if(!h||!g||!window.matchMedia||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
var tx=h.clientWidth*.3,ty=h.clientHeight*.35,x=tx,y=ty;h.addEventListener("mousemove",function(e){var r=h.getBoundingClientRect();tx=e.clientX-r.left;ty=e.clientY-r.top});
(function loop(){if(!document.body.contains(h))return;x+=(tx-x)*.1;y+=(ty-y)*.1;g.style.left=x+"px";g.style.top=y+"px";requestAnimationFrame(loop)})()}
document.addEventListener("mousemove",function(e){var t=e.target.closest&&e.target.closest(".spot,.card");if(t){var r=t.getBoundingClientRect();t.style.setProperty("--x",(e.clientX-r.left)+"px");t.style.setProperty("--y",(e.clientY-r.top)+"px")}});
function start(r){draft={role:r};go("signup/1")}

function s1(){app.innerHTML='<div class="card">'+prog(1,draft.role=="mentor"?6:3)+'<h2>Create your '+draft.role+' account</h2>'+
'<label for="n">Name</label><input id="n" autocomplete="name" value="'+esc(draft.name)+'">'+
'<label for="e">Email</label><input id="e" type="email" autocomplete="email" value="'+esc(draft.email)+'">'+
'<label for="p">Password</label><input id="p" type="password" autocomplete="new-password" value="'+esc(draft.pw)+'">'+
'<label for="a">Age</label><input id="a" type="number" min="5" max="99" value="'+esc(draft.age)+'">'+
'<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input id="g1" type="checkbox" style="width:auto;margin-top:5px">I am 18 or older, or a parent/guardian has approved my use of PairUp.</label><label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input id="g2" type="checkbox" style="width:auto;margin-top:5px">I commit to meeting my match at least twice a month.</label><p class="err" id="err"></p><button class="btn" onclick="n1()">Next</button></div>'}
function n1(){var a=+v("a");if(!document.getElementById("g1").checked||!document.getElementById("g2").checked)return err("Please tick both boxes to continue.");if(!v("n")||!/^\S+@\S+\.\S+$/.test(v("e"))||v("p").length<8||!(a>=5))return err("Enter your name, a valid email, a password of 8+ characters and your age.");
draft.name=v("n");draft.email=v("e").toLowerCase();draft.pw=document.getElementById("p").value;draft.age=a;go("signup/2")}

function s2(){if(draft.role=="mentor"){app.innerHTML='<div class="card">'+prog(2,6)+'<h2>Your background</h2>'+
'<label for="pr">Profession</label><input id="pr" placeholder="e.g. Backend engineer" value="'+esc(draft.profession)+'">'+
'<label for="ex">Years of experience</label><select id="ex">'+["Under 1","1–3","3–5","5–10","10+"].map(function(o){return '<option'+(draft.exp==o?' selected':'')+'>'+o+'</option>'}).join("")+'</select>'+
'<p class="err" id="err"></p><button class="btn alt" onclick="go(\'signup/1\')">Back</button> <button class="btn" onclick="n2()">Next</button></div>'}
else{app.innerHTML='<div class="card">'+prog(2,3)+'<h2>What do you want to learn?</h2>'+
'<label for="l">Language</label><select id="l">'+LANGS.map(function(o){return '<option'+(draft.lang==o?' selected':'')+'>'+o+'</option>'}).join("")+'</select>'+
'<label for="lv">Your level in it</label><select id="lv">'+LEVELS.map(function(o){return '<option'+(draft.level==o?' selected':'')+'>'+o+'</option>'}).join("")+'</select>'+
'<label for="st">Learning stage</label><select id="st">'+["Learning basics","Building projects","Interview prep","Career change"].map(function(o){return '<option'+(draft.stage==o?' selected':'')+'>'+o+'</option>'}).join("")+'</select>'+
(draft.age<18?'<label for="ge">Parent or guardian email</label><input id="ge" type="email" value="'+esc(draft.ge)+'">':'')+'<label>Interests (pick any)</label>'+chips("in",INTS,draft.interests)+'<p class="err" id="err"></p><button class="btn alt" onclick="go(\'signup/1\')">Back</button> <button class="btn" onclick="n2s()">Next</button></div>'}}
function n2(){if(!v("pr"))return err("Enter your profession.");draft.profession=v("pr");draft.exp=v("ex");go("signup/3")}

function s3(){app.innerHTML='<div class="card">'+prog(3,6)+'<h2>Tell students about you</h2><p style="color:var(--mut)">Write 3 sentences about your teaching style and why you want to mentor.</p>'+
'<textarea id="bio" aria-label="About you">'+esc(draft.bio)+'</textarea><p class="err" id="err"></p><button class="btn alt" onclick="go(\'signup/2\')">Back</button> <button class="btn" onclick="n3()">Next</button></div>'}
function n3(){var s=v("bio").split(/[.!?]+/).filter(function(x){return x.trim()});if(s.length!=3)return err("Please write exactly 3 sentences (you wrote "+s.length+").");draft.bio=v("bio");go("signup/4")}

function s4(){app.innerHTML='<div class="card">'+prog(4,6)+'<h2>Languages, skills and specialties</h2>'+
'<label>Programming languages you teach</label>'+chips("lg",LANGS,draft.langs)+
'<label>Skills</label>'+chips("sk",["Debugging","Algorithms","Web apps","APIs","Testing","Code review"],draft.skills)+
'<label>Specialties</label>'+chips("sp",["Beginners","AI","Public speaking","Networking","Data science","Game dev","Mobile","Interview prep","Career guidance"],draft.spec)+
'<p class="err" id="err"></p><button class="btn alt" onclick="go(\'signup/3\')">Back</button> <button class="btn" onclick="n4()">Next</button></div>'}
function n4(){var l=vals("lg");if(!l.length)return err("Pick at least one language.");draft.langs=l;draft.skills=vals("sk");draft.spec=vals("sp");go("signup/5")}

function s5(){app.innerHTML='<div class="card">'+prog(5,6)+'<h2>Verification</h2><p style="color:var(--mut)">Every mentor is reviewed before being matched with students.</p>'+
'<label for="vl">LinkedIn, GitHub or employer/school page (https://)</label><input id="vl" value="'+esc(draft.vlink)+'">'+
'<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input id="cc" type="checkbox" style="width:auto;margin-top:5px">I agree to the Mentor Code of Conduct: no private contact outside PairUp, no in-person meetings with students under 18, public places only, and I consent to a background check.</label>'+
'<p class="err" id="err"></p><button class="btn alt" onclick="go(\'signup/4\')">Back</button> <button class="btn" onclick="n5()">Next</button></div>'}
function n5(){if(!/^https:\/\//.test(v("vl")))return err("Add a profile link starting with https://");
if(!document.getElementById("cc").checked)return err("You must agree to the Code of Conduct.");draft.vlink=v("vl");draft.refs=[];go("plans")}
function n2s(){if(draft.age<18&&!/^\S+@\S+\.\S+$/.test(v("ge")))return err("Enter a parent or guardian email.");if(draft.age<18)draft.ge=v("ge").toLowerCase();draft.lang=v("l");draft.level=v("lv");draft.stage=v("st");draft.interests=vals("in");go("plans")}
function plans(){if(!draft.email){go("home");return}
app.innerHTML=prog(draft.role=="mentor"?6:3,draft.role=="mentor"?6:3)+'<h2>Choose a membership</h2><div class="plans">'+
'<div class="plan"><h3>Basic</h3><div class="price">Free</div><p>Get started with the essentials.</p><button class="btn alt" onclick="finish(\'basic\')">Continue with Basic</button></div>'+
